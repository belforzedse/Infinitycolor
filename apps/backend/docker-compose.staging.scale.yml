# Staging scale override: 2 total Strapi instances.
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.staging.scale.yml up -d --remove-orphans
# Nginx should proxy to strapi_upstream (1337 and 1339).

services:
  strapi-2:
    image: ${REGISTRY_IMAGE_BASE:-registry.cyandm.org/bel4/infinity}/infinity-backend:${IMAGE_TAG:-dev}
    container_name: infinity-strapi-2
    env_file:
      - ${ENV_FILE:-dev.env}
    environment:
      PROCESS_ROLE: web
      DISABLE_BACKGROUND_JOBS: "true"
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://infinity-queue-redis:6379}
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_healthy
      strapi:
        condition: service_healthy
    ports:
      - "127.0.0.1:1339:1337"
    restart: unless-stopped
    volumes:
      - backend_uploads-data:/app/public
    networks:
      - infinity-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1337/api/_health"]
      interval: 30s
      timeout: 30s
      retries: 6
      start_period: 120s
