# Scale override: extra Strapi instances. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d
# All Strapis share the same Postgres, Redis, and uploads volume.
# Nginx should proxy to strapi_upstream (1337–1342).

services:
  strapi-2:
    image: ${REGISTRY_IMAGE_BASE:-registry.cyandm.org/bel4/infinity}/infinity-backend:${IMAGE_TAG:-main}
    container_name: infinity-strapi-2
    env_file:
      - ${ENV_FILE:-main.env}
    environment:
      PROCESS_ROLE: web
      DISABLE_BACKGROUND_JOBS: "true"
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://infinity-queue-redis:6379}
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_healthy
      strapi:
        condition: service_healthy
    ports:
      - "127.0.0.1:1338:1337"
    restart: unless-stopped
    volumes:
      - backend_uploads-data:/app/public
    networks:
      - infinity-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1337/api/_health"]
      interval: 30s
      timeout: 30s
      retries: 6
      start_period: 120s

  strapi-3:
    image: ${REGISTRY_IMAGE_BASE:-registry.cyandm.org/bel4/infinity}/infinity-backend:${IMAGE_TAG:-main}
