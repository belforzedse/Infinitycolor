services:
  strapi:
    container_name: infinity-strapi
    image: ${REGISTRY_IMAGE_BASE:-registry.alpagency.net/bel4/infinity}/infinity-backend:${IMAGE_TAG:-main}
    env_file:
      - ${ENV_FILE:-main.env}
    environment:
      PROCESS_ROLE: web
      DISABLE_BACKGROUND_JOBS: "true"
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://infinity-queue-redis:6379}
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${STRAPI_PORT:-1337}:1337"
    restart: unless-stopped
    volumes:
      - backend_uploads-data:/app/public
    networks:
      - infinity-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1337/api/_health"]
      interval: 30s
      timeout: 30s
      retries: 6
      start_period: 120s

  backend-worker:
    container_name: infinity-backend-worker
    image: ${REGISTRY_IMAGE_BASE:-registry.alpagency.net/bel4/infinity}/infinity-backend:${IMAGE_TAG:-main}
    command: ["pnpm", "run", "worker:prod"]
    env_file:
      - ${ENV_FILE:-main.env}
    environment:
      PROCESS_ROLE: worker
      DISABLE_BACKGROUND_JOBS: "true"
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://infinity-queue-redis:6379}
    depends_on:
      infinity-postgres:
        condition: service_healthy
      infinity-redis:
        condition: service_healthy
      infinity-queue-redis:
        condition: service_healthy
      strapi:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_uploads-data:/app/public
    networks:
      - infinity-network

  backend-scheduler:
    container_name: infinity-backend-scheduler
    image: ${REGISTRY_IMAGE_BASE:-registry.alpagency.net/bel4/infinity}/infinity-backend:${IMAGE_TAG:-main}
    command: ["pnpm", "run", "scheduler:prod"]
    env_file:
      - ${ENV_FILE:-main.env}
    environment:
      PROCESS_ROLE: scheduler
      DISABLE_BACKGROUND_JOBS: "true"
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-redis://infinity-queue-redis:6379}
    depends_on:
      infinity-queue-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infinity-network

  infinity-postgres:
    container_name: infinity-postgres
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    command: >-
      postgres
      -c shared_buffers=20GB
      -c effective_cache_size=120GB
      -c work_mem=64MB
      -c maintenance_work_mem=2GB
      -c max_connections=300
      -c wal_buffers=64MB
      -c max_wal_size=8GB
      -c min_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c huge_pages=try
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c log_min_duration_statement=500
      -c idle_in_transaction_session_timeout=90000
      -c statement_timeout=60000
    restart: unless-stopped
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinity123}
      POSTGRES_DB: ${POSTGRES_DB:-infinity_local}
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - backend_infinity-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

  infinity-redis:
    container_name: infinity-redis
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --auto-aof-rewrite-min-size 256mb
      --maxmemory 64gb
      --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - backend_infinity-redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

  infinity-queue-redis:
    container_name: infinity-queue-redis
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-min-size 256mb
      --maxmemory-policy noeviction
      ${QUEUE_REDIS_PASSWORD:+--requirepass $QUEUE_REDIS_PASSWORD}
    env_file:
      - ${DB_ENV_FILE:-db.env}
    environment:
      - QUEUE_REDIS_PASSWORD=${QUEUE_REDIS_PASSWORD:-}
    volumes:
      - backend_infinity-queue-redis-data:/data
    ports:
      - "127.0.0.1:${QUEUE_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || redis-cli -a \"$$QUEUE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infinity-network

volumes:
  backend_infinity-postgres-data:
    external: true
    name: backend_infinity-postgres-data
  backend_infinity-redis-data:
    external: true
    name: backend_infinity-redis-data
  backend_infinity-queue-redis-data:
    external: true
    name: backend_infinity-queue-redis-data
  backend_uploads-data:
    external: true
    name: backend_uploads-data
networks:
  infinity-network:
    driver: bridge
