packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"
overrides:
  # The browser applications are React 19. A transitive Strapi declaration
  # otherwise wins pnpm's shared type hoist and makes both deploy builds resolve
  # two incompatible ReactNode universes. These are declaration packages only;
  # Strapi's React 18 runtime remains unchanged and separately built.
  "@types/react": 19.2.14
  "@types/react-dom": 19.2.3
  sharp: 0.34.5
peerDependencyRules:
  allowedVersions:
    # react-iran-maps -> react-simple-maps@3 declares peer caps at React 18
    # (^16.8.0 || 17.x || 18.x). Verified against the published react-simple-maps@3
    # tarball: it ships zero `defaultProps` (the actual React 19 breakage), only
    # `propTypes` (ignored at runtime) and `forwardRef` — safe to widen.
    react-simple-maps>react: "19"
    react-simple-maps>react-dom: "19"
allowBuilds:
  '@sentry/cli': false
  '@strapi/strapi': true
  '@swc/core': true
  core-js-pure: true
  cpu-features: false
  esbuild: true
  msw: false
  protobufjs: false
  sharp: true
  ssh2: false
  unrs-resolver: false
  yarn: false
